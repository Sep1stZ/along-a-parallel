# Apply with your own Sealos kubeconfig and current namespace.
# Replace parallel-example.sealoshzh.site with an unused host from your region.
# Check the region's domain, TLS secret, pricing and available credit first.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: along-a-parallel
  labels:
    app: along-a-parallel
    cloud.sealos.io/app-deploy-manager: along-a-parallel
spec:
  replicas: 1
  serviceName: along-a-parallel
  selector:
    matchLabels:
      app: along-a-parallel
  template:
    metadata:
      labels:
        app: along-a-parallel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: along-a-parallel
          image: ghcr.io/sep1stz/along-a-parallel@sha256:0f225928401e34f005795ce1de9305077c477d383578c14a44478233d48dd6d0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_ORIGIN
              value: https://parallel-example.sealoshzh.site
            - name: DB_PATH
              value: /app/.data/parallel.sqlite
            - name: NODE_OPTIONS
              value: --max-old-space-size=160
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/.data
          startupProbe:
            httpGet:
              path: /api/routes
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/routes
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/routes
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          path: /app/.data
          value: '1'
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: along-a-parallel
  labels:
    app: along-a-parallel
    cloud.sealos.io/app-deploy-manager: along-a-parallel
spec:
  selector:
    app: along-a-parallel
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: along-a-parallel
  labels:
    cloud.sealos.io/app-deploy-manager: along-a-parallel
    cloud.sealos.io/app-deploy-manager-domain: parallel-example
    cloud.sealos.io/app-deploy-manager-port: '3000'
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 3m
spec:
  tls:
    - hosts: [parallel-example.sealoshzh.site]
      secretName: wildcard-cert
  rules:
    - host: parallel-example.sealoshzh.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: along-a-parallel
                port:
                  number: 3000
