services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      DB_PATH: /app/.data/parallel.sqlite
    volumes:
      - journey_data:/app/.data
    expose:
      - '3000'
    stop_grace_period: 30s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  journey_data:
  caddy_data:
  caddy_config:
